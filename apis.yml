name: Weav
description: >-
  Weav.ai is an AI-native decisioning platform for property & casualty (P&C) insurance,
  applying agentic AI and document intelligence across underwriting, premium audit, and
  claims. The platform pairs pre-configured, line-of-business knowledge graphs and
  scorecards with an agentic decision engine and human-in-the-loop review, delivered
  through an API-first, no-code architecture that integrates with existing insurance
  systems. Developers integrate via a documented REST surface (documents, folders, forms,
  agents, workflows, actions, and chat services) and a first-party Python developer library
  (weavaidev) published through the weav-ai GitHub organization, authenticated with a
  Bearer token against a per-tenant environment host. Weav.ai is backed by Sierra Ventures
  and is a member of the Guidewire Insurtech Vanguards program.
